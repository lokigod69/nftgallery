<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NFT Gallery - Room 0 (Ocean)</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script>
      // Safety timeout to ensure loading overlay is hidden even if there are script errors
      setTimeout(function() {
        const loadingOverlay = document.getElementById('loading-overlay');
        if (loadingOverlay && loadingOverlay.style.display !== 'none') {
          console.warn('Forcing loading overlay to hide after timeout');
          loadingOverlay.style.display = 'none';
        }
      }, 8000);
    </script>
  </head>
  <body>
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
    </div>
    <div id="controls-description">
      <p>Controls:</p>
      <p>WASD - Move around</p>
      <p>Mouse - Control camera</p>
      <p>ESC - Toggle camera control</p>
    </div>
    <div id="rotate-message" class="rotate-message">Rotate device to landscape</div>
    <div id="move-joystick" class="joystick"></div>
    <div id="look-joystick" class="joystick"></div>
    <div id="nav-container">
      <div id="nav-toggle">&#9776;</div>
      <ul id="nav-menu">
        <li><a href="room0.html">Room 0</a></li>
        <li><a href="room1.html">Room 1</a></li>
        <li><a href="room2.html">Room 2</a></li>
        <li><a href="room3.html">Room 3</a></li>
        <li><a href="room4.html">Room 4</a></li>
        <li><a href="room5.html">Room 5</a></li>
        <li><a href="roomA.html">Room A</a></li>
        <li><a href="roomB.html">Room B</a></li>
      </ul>
    </div>
    <script type="module" src="nav.js"></script>
    <script type="module" src="room0.js"></script>
  </body>
</html>
